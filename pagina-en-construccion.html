<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Página en construcción · Cuerpo de Bomberos La Estrella</title>
	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
	<link rel="icon" href="LOGO_CB_LA_ESTRELLA.png" type="image/png">
	<meta name="robots" content="noindex">
	<style>
		:root{--accent:#ffb020;--muted:#ffffffd9;--glass: rgba(255,255,255,0.06);--glass-2: rgba(255,255,255,0.03)}
		html,body{height:100%;margin:0;font-family: 'Montserrat', 'Open Sans', sans-serif;color:#fff}
		body{background-image: url('cuartel_inauguracion.jpg');background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
		.overlay{position:fixed;inset:0;background:linear-gradient(180deg, rgba(2,6,23,0.5), rgba(2,6,23,0.65));backdrop-filter:blur(3px)}
		.box{position:relative;z-index:2;max-width:920px;width:92%;text-align:center;padding:2rem;border-radius:16px}
		.panel{background:linear-gradient(180deg, var(--glass), var(--glass-2));padding:2.25rem;border-radius:14px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 18px 48px rgba(2,6,23,0.6);backdrop-filter: blur(4px)}
		.logo{width:160px;height:auto;margin:-100px auto 12px;display:block;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.45))}
		h1{font-size:clamp(1.6rem,3.6vw,2.6rem);margin:0 0 .5rem;letter-spacing:0.6px;font-weight:800;text-transform:uppercase}
		p.lead{margin:0;color:var(--muted);font-size:1.05rem}
		.contacts{margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}
		.contact-link{display:inline-flex;align-items:center;gap:10px;color:var(--muted);text-decoration:none;font-weight:600}
		.contact-link svg{width:18px;height:18px;flex-shrink:0;opacity:0.95}
		.contact-link:hover{color:var(--accent);transform:translateY(-2px)}
		.small{font-size:.92rem;opacity:.95;margin-top:12px;color:var(--muted)}
		@keyframes float{0%{transform:translateY(-6px)}50%{transform:translateY(4px)}100%{transform:translateY(-6px)}}
		@media (max-width:520px){.logo{width:120px;margin-top:-70px}.panel{padding:1.25rem}}
	</style>
</head>
<body>
	<div class="overlay" aria-hidden="true"></div>
	<main class="box">
		<img src="LOGO_CB_LA_ESTRELLA.png" alt="Escudo CB La Estrella" class="logo">
		<div class="panel">
			<h1>Página en construcción</h1>
			<p class="lead">Estamos creando el sitio para ofrecerte una mejor experiencia. Volveremos pronto con novedades.</p>
			<div class="contacts" aria-label="Contactos">
				<a class="contact-link" href="mailto:contacto@cblaestrella.cl">
					<!-- email icon -->
					<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 6.5C3 5.6716 3.6716 5 4.5 5h15c.8284 0 1.5.6716 1.5 1.5v11c0 .8284-.6716 1.5-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 7.5l-9 6-9-6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
					<span>contacto@cblaestrella.cl</span>
				</a>
				<a class="contact-link" href="https://www.instagram.com/cblaestrella/" target="_blank" rel="noopener">
					<!-- instagram icon -->
					<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.2"/><path d="M16.5 7.5v0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 16.5c1.3 1.3 3 1.3 4.2 0 1.2-1.2 1.2-2.9 0-4.1-1.2-1.2-2.9-1.2-4.1 0-1.2 1.2-1.2 2.9 0 4.1z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
					<span>@cblaestrella</span>
				</a>
			</div>
			<div class="small">Gracias por tu interés. Pronto compartiremos noticias y novedades.</div>
		</div>
	</main>
</body>
</html>
